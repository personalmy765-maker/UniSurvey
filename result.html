<!DOCTYPE html>

<!DOCTYPE html>

<html lang="en">

<head>
  
  <meta charset="UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>UniSurvey Analysis</title>
  
  <link rel="stylesheet" href="style.css">
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
</head>

<body>
  
  <div class="resultCard">
    
    <h1>🎓 UniSurvey</h1>
    
    <p class="subtitle">
      
      Intelligent Student Analysis Report
      
    </p>
    
    <hr>
    
    <h2 id="studentName"></h2>
    <div class="badgeCard">
  
  <h2 id="badge"></h2>
  
</div>
    
    <div class="scoreBox">
      
      <h3>Academic Readiness</h3>
      
      <div class="scoreCircle">
        
        <span id="score">92%</span>
        
      </div>
      
    </div>
    
    
    <div class="infoCard">
      
      <h3>Department</h3>
      
      <p id="departmentResult"></p>
      
    </div>
    
    <div class="infoCard">
      
      <h3>Dream Career</h3>
      
      <p id="careerResult"></p>
      
    </div>
    <div class="chartCard">
  
  <h2>📊 Student Analytics</h2>
  
  <canvas id="studentChart"></canvas>
  
</div>
    
    <div class="infoCard">
      
      <h3>AI Analysis</h3>

<p id="analysis"></p>

<button id="downloadBtn">

  📄 Download Report
  
</button>
      
      <p id="analysis"></p>
      
    </div>
    
    <div class="developer">
      
      <h3>Application Developed By</h3>
      
      <p>
        
        <b>Anele Chinoye David</b>
        
        <br>
        
        Department of Public Administration
        
        <br>
        
        University of Port Harcourt
        
      </p>
      
    </div>
    
    <button onclick="window.location.href='index.html'">
    
      Return Home
      
    </button>
    
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>
</body>

</html>
