<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniSurvey - Survey</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="surveyCard">

<h1>🎓 UniSurvey</h1>

<h2>Student Questionnaire</h2>

<p>Please answer all the questions below.</p>

<label>Full Name</label>
<input type="text" id="fullname">

<label>Registration Number</label>
<input type="text" id="regno">

<label>Department</label>
<input type="text" id="department">

<label>Faculty</label>
<input type="text" id="faculty">

<label>Level</label>

<select id="level">
<option>Select Level</option>
<option>100 Level</option>
<option>200 Level</option>
<option>300 Level</option>
<option>400 Level</option>
<option>500 Level</option>
</select>

<label>Age</label>

<input type="number" id="age">

<label>Gender</label>

<select id="gender">

<option>Select Gender</option>

<option>Male</option>

<option>Female</option>

</select>

<label>Why did you choose your department?</label>

<textarea id="reason"></textarea>

<label>Favourite Course</label>

<input type="text" id="course">

<label>Most Difficult Course</label>

<input type="text" id="difficult">

<label>How many hours do you study daily?</label>

<select id="study">

<option>Less than 1 hour</option>

<option>1-2 Hours</option>

<option>3-5 Hours</option>

<option>More than 5 Hours</option>

</select>

<label>Dream Career</label>

<input type="text" id="career">

<br><br>

<button id="submitBtn">

Submit Survey

</button>

</div>

<script src="script.js"></script>

</body>

</html>
